openapi: 3.0.0
info:
  title: Trucker Profiles API
  version: "1.0.0"
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Register user
      responses:
        "201":
          description: Created
  /auth/login:
    post:
      summary: Login user
      responses:
        "200":
          description: OK
  /profiles:
    get:
      summary: Get all profiles (auth required)
      responses:
        "200":
          description: OK
    post:
      summary: Create profile (auth required)
      responses:
        "201":
          description: Created
