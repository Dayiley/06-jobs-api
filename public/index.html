<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trucker Profiles</title>
  </head>

  <body>
    <h1>Trucker Profiles</h1>
    <hr />
    <p id="message"></p>
    <hr />

    <div id="logon-register" style="display: none">
      <button type="button" id="logon">logon</button>
      <button type="button" id="register">register</button>
    </div>

    <div id="logon-div" style="display: none">
      <form>
        <div>
          <label for="email">email:</label>
          <input type="email" id="email" />
        </div>
        <div>
          <label for="password">password:</label>
          <input type="password" id="password" />
        </div>
        <button type="button" id="logon-button">logon</button>
        <button type="button" id="logon-cancel">cancel</button>
      </form>
    </div>

    <div id="register-div" style="display: none">
      <form>
        <div>
          <label for="name">name:</label>
          <input type="text" id="name" />
        </div>
        <div>
          <label for="email1">email:</label>
          <input type="email" id="email1" />
        </div>
        <div>
          <label for="password1">password:</label>
          <input type="password" id="password1" />
        </div>
        <div>
          <label for="password2">verify password:</label>
          <input type="password" id="password2" />
        </div>
        <button type="button" id="register-button">register</button>
        <button type="button" id="register-cancel">cancel</button>
      </form>
    </div>

    <div id="profiles" style="display: none">
      <p id="profiles-message"></p>
      <table id="profiles-table">
        <tr id="profiles-table-header">
          <th>Full Name</th>
          <th>Position Type</th>
          <th>Years Exp</th>
          <th>State</th>
          <th colspan="2"></th>
        </tr>
      </table>
      <button type="button" id="add-profile">add profile</button>
      <button type="button" id="logoff">log off</button>
    </div>

    <div id="edit-profile" style="display: none">
      <form>
        <div>
          <label for="fullName">full name:</label>
          <input type="text" id="fullName" />
        </div>

        <div>
          <label for="positionType">position type:</label>
          <select id="positionType">
            <option value="driver">driver</option>
            <option value="mechanic">mechanic</option>
            <option value="dispatcher">dispatcher</option>
            <option value="safety">safety</option>
            <option value="other">other</option>
          </select>
        </div>

        <div>
          <label for="yearsExperience">years experience:</label>
          <input type="number" id="yearsExperience" min="0" />
        </div>

        <div>
          <label for="state">state:</label>
          <input type="text" id="state" maxlength="2" />
        </div>

        <button type="button" id="save-profile">add</button>
        <button type="button" id="edit-cancel">cancel</button>
      </form>
    </div>

    <script src="./index.js" type="module"></script>
  </body>
</html>
